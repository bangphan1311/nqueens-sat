[project]
name = "nqsat"
version = "0.1.0"
description = "Benchmark SAT encodings and exact solvers for the N-Queens problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cplex>=22.2.0.1",
    "docplex>=2.32.264",
    "gurobipy>=13.0.3",
    "ortools>=9.15.6755",
    "pycryptosat>=5.16.0",
    "python-sat>=1.9.dev15",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
